name: RADAR
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  trabajar:
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Trabajar
        run: node radar.mjs
        env:
          RADAR_CLAVE: ${{ secrets.RADAR_CLAVE }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          WA_TELEFONO: ${{ secrets.WA_TELEFONO }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          PEDIDO_TITULO: ${{ github.event.issue.title }}
          PEDIDO_TEXTO: ${{ github.event.issue.body }}
          PEDIDO_NUM: ${{ github.event.issue.number }}
          LIMITE_MIN: '35'
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "RADAR"
          git config user.email "radar@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -m "RADAR: trabajo automático"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin HEAD && git push && exit 0; sleep 10; done
          exit 1
